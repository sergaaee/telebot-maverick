root /usr/share/nginx/html;
index index.html;
client_max_body_size 2m;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Docker DNS: адрес backend определяется при каждом запросе (контейнер может перезапуститься с новым IP)
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8000;

# хэшированные файлы сборки — кешируем надолго
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

# вход: ограничение частоты запросов (поверх защиты от перебора в самом приложении)
location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass $backend_upstream;
}

location /api/ {
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass $backend_upstream;
}

# одностраничное приложение
location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
}
